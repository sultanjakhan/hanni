<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #191919; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: #191919;
    border-radius: 0;
    cursor: move;
    user-select: none;
    -webkit-app-region: drag;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4F9768;
    flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .title {
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100px;
  }
  .timer {
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .stop-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    padding: 2px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .stop-btn:hover { color: #E06C75; background: rgba(224,108,117,0.15); }
  .idle { display: none; color: rgba(255,255,255,0.4); font-size: 12px; padding: 16px; text-align: center; }
  .idle.visible { display: block; }
</style>
</head>
<body>
<div class="pill" id="pill" style="display:none;">
  <span class="dot"></span>
  <span class="title" id="overlay-title">...</span>
  <span class="timer" id="overlay-timer">00:00</span>
  <button class="stop-btn" id="overlay-stop" title="Stop">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
</div>
<div class="idle" id="idle-msg">No active focus</div>

<script src="focus-overlay.js"></script>
</body>
</html>
