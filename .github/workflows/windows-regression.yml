name: Windows regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanni-windows-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows locked checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: windows-regression

      - name: Ensure native crypto assembler
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress --yes
          }
          cmake --version
          nasm -v

      - name: Verify locked Cargo metadata
        run: cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml --no-deps --format-version 1

      - name: Install locked npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Run existing JavaScript security tests
        working-directory: desktop
        run: npm run test:security

      - name: Run Issue #34 prototype tests
        working-directory: desktop
        run: node --test tests/issue-34-prototype.test.mjs

      - name: Run vendor integrity check
        working-directory: desktop
        run: npm run vendor:check

      - name: Check Rust targets
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets

      - name: Run Rust library tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib
