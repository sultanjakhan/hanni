name: Release Android

env:
  # Public SHA-256 fingerprint of the release certificate used by v1.1.5.
  TRUSTED_ANDROID_CERT_SHA256: F0DD5C4C931FA2A8EBE2D223136D71293DBDE7EA59130615B6B5EB11FC530C63

on:
  push:
    tags:
      - 'v*'
      # Test builds: push an 'android-test*' tag at any commit. The signed APK
      # lands in the 'android-test' PRERELEASE, so neither the desktop updater
      # (latest.json of the latest release) nor the phone's in-app updater
      # (releases/latest excludes prereleases) ever picks it up.
      - 'android-test*'
  workflow_dispatch:
    inputs:
      health_candidate:
        description: Build a compatible signed health APK as an artifact only
        required: false
        default: false
        type: boolean
      reviewed_main_sha:
        description: Required for health_candidate; full SHA of reviewed main
        required: false
        type: string

concurrency:
  group: hanni-android-${{ github.ref_name }}
  queue: max
  cancel-in-progress: false

jobs:
  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: hanni-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate build context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          HEALTH_CANDIDATE: ${{ inputs.health_candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$HEALTH_CANDIDATE" = true ]; then
            test "$REF_TYPE" = branch
            test "$REF_NAME" = main
            [[ "$REVIEWED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$REVIEWED_MAIN_SHA"
            test "$(git rev-parse HEAD)" = "$REVIEWED_MAIN_SHA"
            git diff --exit-code HEAD
            MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$MAIN_SHA" = "$REVIEWED_MAIN_SHA"
            test -f desktop/src-tauri/src/cloud_relay.rs
            test -f desktop/src-tauri/android-plugin/src/main/java/com/sultanjakhan/hanni/RawHealthRecordStore.kt
            test -f scripts/check-health-apk-permissions.py
            python3 - <<'PY'
          import json, pathlib, re

          path = pathlib.Path("desktop/src-tauri/tauri.health-candidate.conf.json")
          config = json.loads(path.read_text())
          version = config.get("version", "")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("candidate version must be a three-part numeric version")
          major, minor, patch = map(int, version.split("."))
          code = major * 1000000 + minor * 1000 + patch
          expected = {"version": version, "bundle": {"android": {"versionCode": code}}}
          if config != expected or not 1001014 < code <= 2100000000:
              raise SystemExit("candidate must only override a coherent version above installed 1.1.14")
          PY
          fi
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ] \
             && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$GITHUB_SHA" = "$MAIN_SHA"
            VERSION="${REF_NAME#v}"
            python3 - "$VERSION" <<'PY'
          import json, pathlib, re, sys

          expected = sys.argv[1]
          tauri = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())
          cargo_text = pathlib.Path("desktop/src-tauri/Cargo.toml").read_text()
          cargo_match = re.search(
              r'(?ms)^\[package\]\s*$.*?^version\s*=\s*"([^"]+)"', cargo_text
          )
          if not cargo_match:
              raise SystemExit("Cargo.toml package version not found")
          actual = {
              "tauri.conf.json": tauri.get("version"),
              "Cargo.toml": cargo_match.group(1),
          }
          mismatched = {name: value for name, value in actual.items() if value != expected}
          if mismatched:
              raise SystemExit(f"release tag version {expected!r} does not match {mismatched!r}")
          PY
            echo "RELEASE_KIND=production" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          elif { [ "$EVENT_NAME" = workflow_dispatch ] \
                  || { [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ] \
                       && [[ "$REF_NAME" =~ ^android-test[A-Za-z0-9._-]*$ ]]; }; }; then
            echo "RELEASE_KIND=test" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=android-test" >> "$GITHUB_ENV"
          else
            echo "Unsupported Android build context" >&2
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install native crypto build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build nasm

      - name: Install NDK 27.2.12479018
        run: sdkmanager "ndk;27.2.12479018" "build-tools;36.0.0"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          # arm64 only — every target phone (and ~all modern Android) is arm64.
          # A universal APK bundles 4 ABIs' native .so, ~doubling download size
          # for no benefit on these devices. See build step's --target aarch64.
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: android

      - name: Verify committed Cargo lockfile
        run: cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      # The cr-sqlite native lib (CRDT sync) lives in a gitignored jniLibs dir,
      # so CI checkouts lack it → the APK ships without libcrsqlite.so → dlopen
      # fails at runtime ("library libcrsqlite.so not found") → sync disabled.
      # Copy the tracked arm64 lib into jniLibs so gradle packages it into
      # lib/arm64-v8a/. Without this, Mac↔Android databases silently diverge.
      - name: Bundle cr-sqlite native lib (jniLibs is gitignored)
        run: |
          DEST=desktop/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          cp desktop/src-tauri/libs/android-aarch64/crsqlite.so "$DEST/libcrsqlite.so"
          ls -la "$DEST"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hanni-release.jks"
          chmod 600 "$RUNNER_TEMP/hanni-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hanni-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK (release)
        working-directory: desktop
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          HEALTH_CANDIDATE: ${{ inputs.health_candidate }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$HEALTH_CANDIDATE" = true ]; then
            npx tauri android build --apk --target aarch64 \
              --config src-tauri/tauri.health-candidate.conf.json
          else
            npx tauri android build --apk --target aarch64
          fi

      - name: Verify health candidate APK before publication
        if: github.event_name == 'workflow_dispatch' && inputs.health_candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, tomllib, zipfile

          root = pathlib.Path.cwd()
          config = json.loads((root / "desktop/src-tauri/tauri.health-candidate.conf.json").read_text())
          version = config["version"]
          code = config["bundle"]["android"]["versionCode"]
          outputs = root / "desktop/src-tauri/gen/android/app/build/outputs/apk"
          apks = [p for p in outputs.rglob("*.apk") if p.parent.name == "release" and "unsigned" not in p.name]
          if len(apks) != 1:
              raise SystemExit("expected exactly one signed release APK")
          apk = apks[0]
          build_tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools"
          aapt2 = build_tools / "36.0.0/aapt2"
          apksigner = build_tools / "36.0.0/apksigner"
          if not aapt2.is_file() or not apksigner.is_file():
              raise SystemExit("Android build-tools 36.0.0 aapt2/apksigner are required")
          signature = subprocess.check_output([str(apksigner), "verify", "--verbose", "--print-certs", str(apk)], text=True)
          certs = re.findall(r"(?m)^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-fA-F]+)$", signature)
          if len(certs) != 1 or certs[0].upper() != os.environ["TRUSTED_ANDROID_CERT_SHA256"]:
              raise SystemExit("candidate must use the existing production Android certificate")
          badging = subprocess.check_output([str(aapt2), "dump", "badging", str(apk)], text=True)
          package = next((line for line in badging.splitlines() if line.startswith("package:")), "")
          attrs = dict(re.findall(r"(\w+)='([^']*)'", package))
          if attrs.get("name") != "com.sultanjakhan.hanni" or attrs.get("versionName") != version or attrs.get("versionCode") != str(code):
              raise SystemExit("APK package/version does not match the reviewed candidate")
          props_path = root / "desktop/src-tauri/gen/android/app/tauri.properties"
          props = dict(line.split("=", 1) for line in props_path.read_text().splitlines() if "=" in line and not line.startswith("//"))
          if props.get("tauri.android.versionName") != version or props.get("tauri.android.versionCode") != str(code):
              raise SystemExit("generated Tauri version does not match APK metadata")
          with zipfile.ZipFile(apk) as payload:
              required = {"lib/arm64-v8a/libhanni_lib.so", "lib/arm64-v8a/libcrsqlite.so"}
              if not required.issubset(payload.namelist()):
                  raise SystemExit("required ARM64 native libraries are missing")
          subprocess.run(["python3", "scripts/check-health-apk-permissions.py", "--apk", str(apk), "--aapt2", str(aapt2)], check=True)
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != os.environ["GITHUB_SHA"]:
              raise SystemExit("checkout HEAD changed during the build")
          changed = subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines()
          cargo_path = "desktop/src-tauri/Cargo.toml"
          if set(changed) - {cargo_path}:
              raise SystemExit("build modified tracked source beyond Cargo.toml formatting")
          if cargo_path in changed:
              before = subprocess.check_output(["git", "show", "HEAD:" + cargo_path], text=True)
              if tomllib.loads(before) != tomllib.loads((root / cargo_path).read_text()):
                  raise SystemExit("build changed Cargo.toml semantics")
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hanni-health-candidate"
          destination.mkdir()
          artifact = destination / f"hanni-{version}-android.apk"
          shutil.copyfile(apk, artifact)
          result = {"schema": "hanni.health-candidate.v1", "source_commit": source,
                    "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                    "candidate_version": version, "candidate_version_code": code,
                    "config_sha256": hashlib.sha256((root / "desktop/src-tauri/tauri.health-candidate.conf.json").read_bytes()).hexdigest(),
                    "apk_sha256": hashlib.file_digest(artifact.open("rb"), "sha256").hexdigest(),
                    "apk_bytes": artifact.stat().st_size, "official_signer_matches": True,
                    "apk_metadata_and_health_permissions": "PASS", "installed": False}
          (destination / "verification.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY

      - name: Upload signed health candidate artifact
        if: github.event_name == 'workflow_dispatch' && inputs.health_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hanni-health-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/hanni-health-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Wait for release to exist (release.yml creates it)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          # Desktop production releases are serialized; leave enough time for
          # an older native release to finish before this tag creates its draft.
          for i in $(seq 1 320); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists"
              exit 0
            fi
            echo "Release $TAG not yet — waiting (attempt $i/320)"
            sleep 15
          done
          echo "Release $TAG never appeared; refusing to create a partial production release" >&2
          exit 1

      - name: Upload APK to release
        if: github.event_name != 'workflow_dispatch' || !inputs.health_candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ "$RELEASE_KIND" = production ]; then
            VERSION="${TAG#v}"
          else
            VERSION="test-${SOURCE_SHA:0:12}"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --prerelease --target "$SOURCE_SHA" \
                --title "Hanni Android test build" \
                --notes "Manual test build — not picked up by updaters."
            gh release edit "$TAG" --prerelease \
              --notes "Manual test build from $SOURCE_REF @ $SOURCE_SHA ($(date -u +%Y-%m-%dT%H:%MZ)) — not picked up by updaters."
          fi
          APK=desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$APK" ]; then
            APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' ! -name '*unsigned*' -print -quit)
          fi
          test -n "$APK"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ "$CERT_SHA256" != "$TRUSTED_ANDROID_CERT_SHA256" ]; then
            echo "Android release certificate fingerprint mismatch" >&2
            exit 1
          fi
          ls -la "$APK"
          UPLOAD_APK="$RUNNER_TEMP/hanni-${VERSION}-android.apk"
          install -m 0644 "$APK" "$UPLOAD_APK"
          if [ "$RELEASE_KIND" = production ]; then
            bash scripts/recover-starter-release-assets.sh "$TAG" "$(basename "$UPLOAD_APK")"
            gh release upload "$TAG" "$UPLOAD_APK"
          else
            gh release upload "$TAG" "$UPLOAD_APK" --clobber
          fi

      # NOTE: the OTA web bundle + signed, versioned manifest are
      # published once from release.yml (the desktop job that creates the
      # release), NOT here — both platforms read the same manifest, and two `tar`
      # runs would embed different mtimes → different sha256 → a --clobber race
      # could strand a bundle whose bytes don't match the manifest sha.
