name: Release Android

env:
  # Public SHA-256 fingerprint of the release certificate used by v1.1.5.
  TRUSTED_ANDROID_CERT_SHA256: F0DD5C4C931FA2A8EBE2D223136D71293DBDE7EA59130615B6B5EB11FC530C63

on:
  push:
    tags:
      - 'v*'
      # Test builds: push an 'android-test*' tag at any commit. The signed APK
      # lands in the 'android-test' PRERELEASE, so neither the desktop updater
      # (latest.json of the latest release) nor the phone's in-app updater
      # (releases/latest excludes prereleases) ever picks it up.
      - 'android-test*'
  workflow_dispatch:

concurrency:
  group: hanni-android-${{ github.ref_name }}
  queue: max
  cancel-in-progress: false

jobs:
  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: hanni-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate build context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ] \
             && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            test "$GITHUB_SHA" = "$MAIN_SHA"
            VERSION="${REF_NAME#v}"
            python3 - "$VERSION" <<'PY'
          import json, pathlib, re, sys

          expected = sys.argv[1]
          tauri = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text())
          cargo_text = pathlib.Path("desktop/src-tauri/Cargo.toml").read_text()
          cargo_match = re.search(
              r'(?ms)^\[package\]\s*$.*?^version\s*=\s*"([^"]+)"', cargo_text
          )
          if not cargo_match:
              raise SystemExit("Cargo.toml package version not found")
          actual = {
              "tauri.conf.json": tauri.get("version"),
              "Cargo.toml": cargo_match.group(1),
          }
          mismatched = {name: value for name, value in actual.items() if value != expected}
          if mismatched:
              raise SystemExit(f"release tag version {expected!r} does not match {mismatched!r}")
          PY
            echo "RELEASE_KIND=production" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$REF_NAME" >> "$GITHUB_ENV"
          elif { [ "$EVENT_NAME" = workflow_dispatch ] \
                  || { [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ] \
                       && [[ "$REF_NAME" =~ ^android-test[A-Za-z0-9._-]*$ ]]; }; }; then
            echo "RELEASE_KIND=test" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=android-test" >> "$GITHUB_ENV"
          else
            echo "Unsupported Android build context" >&2
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install native crypto build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build nasm

      - name: Install NDK 27.2.12479018
        run: sdkmanager "ndk;27.2.12479018"

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          # arm64 only — every target phone (and ~all modern Android) is arm64.
          # A universal APK bundles 4 ABIs' native .so, ~doubling download size
          # for no benefit on these devices. See build step's --target aarch64.
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: android

      - name: Verify committed Cargo lockfile
        run: cargo metadata --locked --manifest-path desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      # The cr-sqlite native lib (CRDT sync) lives in a gitignored jniLibs dir,
      # so CI checkouts lack it → the APK ships without libcrsqlite.so → dlopen
      # fails at runtime ("library libcrsqlite.so not found") → sync disabled.
      # Copy the tracked arm64 lib into jniLibs so gradle packages it into
      # lib/arm64-v8a/. Without this, Mac↔Android databases silently diverge.
      - name: Bundle cr-sqlite native lib (jniLibs is gitignored)
        run: |
          DEST=desktop/src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          cp desktop/src-tauri/libs/android-aarch64/crsqlite.so "$DEST/libcrsqlite.so"
          ls -la "$DEST"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hanni-release.jks"
          chmod 600 "$RUNNER_TEMP/hanni-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hanni-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK (release)
        working-directory: desktop
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --target aarch64

      - name: Wait for release to exist (release.yml creates it)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          # Desktop production releases are serialized; leave enough time for
          # an older native release to finish before this tag creates its draft.
          for i in $(seq 1 320); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists"
              exit 0
            fi
            echo "Release $TAG not yet — waiting (attempt $i/320)"
            sleep 15
          done
          echo "Release $TAG never appeared; refusing to create a partial production release" >&2
          exit 1

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ "$RELEASE_KIND" = production ]; then
            VERSION="${TAG#v}"
          else
            VERSION="test-${SOURCE_SHA:0:12}"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --prerelease --target "$SOURCE_SHA" \
                --title "Hanni Android test build" \
                --notes "Manual test build — not picked up by updaters."
            gh release edit "$TAG" --prerelease \
              --notes "Manual test build from $SOURCE_REF @ $SOURCE_SHA ($(date -u +%Y-%m-%dT%H:%MZ)) — not picked up by updaters."
          fi
          APK=desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$APK" ]; then
            APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' ! -name '*unsigned*' -print -quit)
          fi
          test -n "$APK"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ "$CERT_SHA256" != "$TRUSTED_ANDROID_CERT_SHA256" ]; then
            echo "Android release certificate fingerprint mismatch" >&2
            exit 1
          fi
          ls -la "$APK"
          UPLOAD_APK="$RUNNER_TEMP/hanni-${VERSION}-android.apk"
          install -m 0644 "$APK" "$UPLOAD_APK"
          if [ "$RELEASE_KIND" = production ]; then
            bash scripts/recover-starter-release-assets.sh "$TAG" "$(basename "$UPLOAD_APK")"
            gh release upload "$TAG" "$UPLOAD_APK"
          else
            gh release upload "$TAG" "$UPLOAD_APK" --clobber
          fi

      # NOTE: the OTA web bundle + signed, versioned manifest are
      # published once from release.yml (the desktop job that creates the
      # release), NOT here — both platforms read the same manifest, and two `tar`
      # runs would embed different mtimes → different sha256 → a --clobber race
      # could strand a bundle whose bytes don't match the manifest sha.
